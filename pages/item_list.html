<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanifest — All Items</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/scanifest-utils.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    width: 100%;
    margin: 40px auto;
    padding: 0 20px;
    box-sizing: border-box;
    color: #1a1a1a;
  }
  header { margin-bottom: 12px; }
  a.back {
    display: block;
    font-size: 13px;
    color: #666;
    text-decoration: none;
    margin-bottom: 4px;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 8px 0 2px 0;
  }
  h1 { font-size: 20px; margin: 0; }
  button.csv-btn {
    font-size: 12px;
    color: #1a1a1a;
    background: none;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.csv-btn:hover { border-color: #999; }
  #itemsSummary { color: #666; font-size: 13px; margin-bottom: 16px; }
  input, select {
    width: 100%;
    padding: 9px;
    margin-bottom: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  input:focus, select:focus { outline: none; border-color: #1a1a1a; }
  .control-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .control-grid select { margin-bottom: 0; }
  h2 { font-size: 15px; margin-top: 24px; margin-bottom: 10px; color: #444; }
  .item-row {
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .item-row .top-line {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .item-row .desc { font-size: 14px; }
  .item-row .meta { color: #666; font-size: 12px; margin-top: 2px; }
  .item-row .box-tag {
    display: inline-block;
    font-size: 11px;
    color: #666;
    text-decoration: none;
    margin-top: 4px;
  }
  .item-row .box-tag:hover { text-decoration: underline; }
  .item-row .actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  button.edit-btn {
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    color: #1a1a1a;
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
  }
  button.delete-btn {
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    color: #c0392b;
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
  }
  .edit-fields { flex: 1; }
  .edit-actions { display: flex; gap: 8px; margin-top: 6px; }
  .edit-actions button { flex: 1; }
  button.cancel-btn {
    background: none;
    border: 1px solid #ccc;
    border-radius: 6px;
    color: #1a1a1a;
    font-size: 13px;
    padding: 8px;
    cursor: pointer;
  }
  select.move-select-full {
    width: 100%;
    padding: 9px;
    margin-bottom: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  #emptyItems { color: #666; font-size: 14px; margin: 8px 0; }
  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .field-grid input { margin-bottom: 0; }
  button.primary {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin-top: 6px;
  }
  #status {
    margin-top: 12px;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }
  #status.success { background: #e6f4ea; color: #1e7e34; display: block; }
  #status.error { background: #fdecea; color: #c0392b; display: block; }
</style>
</head>
<body>

<header>
  <a class="back" href="shipment_detail.html" id="backToShipment">← Back to shipment</a>
  <div class="title-row">
    <h1>All items</h1>
    <button class="csv-btn" onclick="downloadCSV()">Download as CSV</button>
  </div>
  <div id="itemsSummary"></div>
</header>

<div id="status"></div>

<h2>Items</h2>
<input type="text" id="searchInput" placeholder="Search by description..." oninput="applyFiltersAndRender()">

<div class="control-grid">
  <select id="filterBox" onchange="applyFiltersAndRender()"></select>
  <select id="filterCategory" onchange="applyFiltersAndRender()"></select>
</div>
<div class="control-grid">
  <select id="filterSubcategory" onchange="applyFiltersAndRender()"></select>
  <select id="sortField" onchange="applyFiltersAndRender()">
    <option value="description">Sort: Description</option>
    <option value="quantity">Sort: Quantity</option>
    <option value="category">Sort: Category</option>
    <option value="subcategory">Sort: Subcategory</option>
    <option value="material">Sort: Material</option>
    <option value="box">Sort: Box</option>
  </select>
</div>
<select id="sortDirection" onchange="applyFiltersAndRender()">
  <option value="asc">Ascending</option>
  <option value="desc">Descending</option>
</select>

<div id="emptyItems" style="display:none;">No items match your filters.</div>
<div id="itemList"></div>

<h2>Add item</h2>
<select id="newItemBox"></select>
<input type="text" id="itemDescription" placeholder="Description">
<div class="field-grid">
  <input type="number" id="itemQuantity" placeholder="Qty" value="1">
  <input type="text" id="itemCategory" placeholder="Category">
</div>
<div class="field-grid">
  <input type="text" id="itemSubcategory" placeholder="Subcategory">
  <input type="text" id="itemMaterial" placeholder="Material (optional)">
</div>
<button class="primary" onclick="addItem()">+ Add item</button>

<script>
  const params = new URLSearchParams(window.location.search);
  const shipmentId = params.get('shipment_id');
  const boxId = params.get('box_id'); // optional - present when arriving from a specific box

  const statusEl = document.getElementById('status');
  let boxMap = {}; // box_id -> {number, room}
  let allItems = [];
  let currentFilteredItems = [];

  function showStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = isError ? 'error' : 'success';
    statusEl.style.display = message ? 'block' : 'none';
  }

  function populateSelect(selectEl, options, allLabel) {
    selectEl.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = allLabel;
    selectEl.appendChild(allOpt);
    options.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt.value;
      o.textContent = opt.label;
      selectEl.appendChild(o);
    });
  }

  async function loadData() {
    const { data: boxes } = await supabaseClient
      .from('boxes')
      .select('id, room')
      .eq('shipment_id', shipmentId)
      .order('created_date', { ascending: true });

    const boxList = boxes || [];
    boxMap = {};
    boxList.forEach((b, idx) => {
      boxMap[b.id] = { number: idx + 1, room: b.room };
    });

    const boxIds = boxList.map(b => b.id);
    if (boxIds.length > 0) {
      const { data: items } = await supabaseClient
        .from('items')
        .select('*')
        .in('box_id', boxIds);
      allItems = items || [];
    } else {
      allItems = [];
    }

    // Populate filter dropdowns
    const boxOptions = boxList.map((b, idx) => ({
      value: b.id,
      label: `Box ${idx + 1} — ${b.room || 'Unassigned room'}`
    }));
    populateSelect(document.getElementById('filterBox'), boxOptions, 'All boxes');
    populateSelect(document.getElementById('newItemBox'), boxOptions, 'Choose a box...');

    const categories = [...new Set(allItems.map(i => i.category).filter(Boolean))].sort();
    populateSelect(document.getElementById('filterCategory'),
      categories.map(c => ({ value: c, label: c })), 'All categories');

    const subcategories = [...new Set(allItems.map(i => i.subcategory).filter(Boolean))].sort();
    populateSelect(document.getElementById('filterSubcategory'),
      subcategories.map(c => ({ value: c, label: c })), 'All subcategories');

    applyFiltersAndRender();
  }

  function getSortValue(item, field) {
    if (field === 'quantity') return item.quantity || 0;
    if (field === 'box') return (boxMap[item.box_id] && boxMap[item.box_id].number) || 0;
    return (item[field] || '').toString().toLowerCase();
  }

  function applyFiltersAndRender() {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    const filterBox = document.getElementById('filterBox').value;
    const filterCategory = document.getElementById('filterCategory').value;
    const filterSubcategory = document.getElementById('filterSubcategory').value;
    const sortField = document.getElementById('sortField').value;
    const sortDir = document.getElementById('sortDirection').value;

    let filtered = allItems.filter(item => {
      if (search && !(item.description || '').toLowerCase().includes(search)) return false;
      if (filterBox && item.box_id !== filterBox) return false;
      if (filterCategory && item.category !== filterCategory) return false;
      if (filterSubcategory && item.subcategory !== filterSubcategory) return false;
      return true;
    });

    filtered.sort((a, b) => {
      const va = getSortValue(a, sortField);
      const vb = getSortValue(b, sortField);
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    currentFilteredItems = filtered;
    renderItems(filtered);

    const distinctCount = filtered.length;
    const totalQty = filtered.reduce((sum, i) => sum + (i.quantity || 1), 0);
    document.getElementById('itemsSummary').textContent =
      `${distinctCount} entr${distinctCount === 1 ? 'y' : 'ies'} ⬝ ${totalQty} item${totalQty === 1 ? '' : 's'} total`;
  }

  function renderItems(items) {
    const listEl = document.getElementById('itemList');
    const emptyEl = document.getElementById('emptyItems');
    listEl.innerHTML = '';

    if (items.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item-row';
      div.id = 'item-' + item.id;
      div.innerHTML = itemViewHtml(item);
      listEl.appendChild(div);
    });
  }

  function itemViewHtml(item) {
    const qty = item.quantity && item.quantity !== 1 ? ` x${item.quantity}` : '';
    const catSub = [item.category, item.subcategory].filter(Boolean).join(' / ');
    const metaParts = [catSub, item.material].filter(Boolean);
    const boxInfo = boxMap[item.box_id];
    const boxLabel = boxInfo ? `Box ${boxInfo.number} — ${boxInfo.room || 'Unassigned room'}` : 'Unknown box';

    return `
      <div class="info">
        <div class="desc"><b>${escapeHtml(item.description || 'Untitled item')}</b>${qty}</div>
        <div class="meta">${escapeHtml(metaParts.join(' ⬝ '))}</div>
        <a class="box-tag" href="box_detail.html?id=${item.box_id}">${escapeHtml(boxLabel)}</a>
      </div>
      <div class="actions">
        <button class="edit-btn" onclick="editItem('${item.id}')">Edit</button>
        <button class="delete-btn" onclick="deleteItem('${item.id}')">Remove</button>
      </div>
    `;
  }

  function itemEditHtml(item) {
    let moveOptions = '<option value="">Keep in current box</option>';
    Object.keys(boxMap).forEach(bId => {
      if (bId === item.box_id) return;
      const b = boxMap[bId];
      moveOptions += `<option value="${bId}">Move to Box ${b.number} — ${escapeHtml(b.room || 'Unassigned room')}</option>`;
    });

    return `
      <div class="edit-fields">
        <input type="text" id="edit-desc-${item.id}" value="${escapeHtml(item.description || '')}" placeholder="Description">
        <div class="field-grid">
          <input type="number" id="edit-qty-${item.id}" value="${item.quantity || 1}" placeholder="Qty">
          <input type="text" id="edit-cat-${item.id}" value="${escapeHtml(item.category || '')}" placeholder="Category">
        </div>
        <div class="field-grid">
          <input type="text" id="edit-subcat-${item.id}" value="${escapeHtml(item.subcategory || '')}" placeholder="Subcategory">
          <input type="text" id="edit-material-${item.id}" value="${escapeHtml(item.material || '')}" placeholder="Material (optional)">
        </div>
        <select id="edit-move-${item.id}" class="move-select-full">${moveOptions}</select>
        <div class="edit-actions">
          <button class="primary" onclick="saveItemEdit('${item.id}')">Save</button>
          <button class="cancel-btn" onclick="cancelEditItem('${item.id}')">Cancel</button>
        </div>
      </div>
    `;
  }

  function editItem(itemId) {
    const item = allItems.find(i => i.id === itemId);
    const row = document.getElementById('item-' + itemId);
    if (!item || !row) return;
    row.innerHTML = itemEditHtml(item);
  }

  function cancelEditItem(itemId) {
    const item = allItems.find(i => i.id === itemId);
    const row = document.getElementById('item-' + itemId);
    if (!item || !row) return;
    row.innerHTML = itemViewHtml(item);
  }

  async function saveItemEdit(itemId) {
    const description = document.getElementById('edit-desc-' + itemId).value.trim();
    if (!description) {
      showStatus('Give the item a description first.', true);
      return;
    }
    const qtyRaw = document.getElementById('edit-qty-' + itemId).value;
    const payload = {
      description: description,
      quantity: qtyRaw ? parseInt(qtyRaw, 10) : 1,
      category: document.getElementById('edit-cat-' + itemId).value.trim(),
      subcategory: document.getElementById('edit-subcat-' + itemId).value.trim(),
      material: document.getElementById('edit-material-' + itemId).value.trim()
    };

    const moveSelect = document.getElementById('edit-move-' + itemId);
    const targetBoxId = moveSelect ? moveSelect.value : '';
    if (targetBoxId) payload.box_id = targetBoxId;

    const { error } = await supabaseClient.from('items').update(payload).eq('id', itemId);
    if (error) {
      showStatus('Failed to save item: ' + error.message, true);
      return;
    }
    showStatus(targetBoxId ? 'Item updated and moved.' : 'Item updated.', false);
    await recomputeShipmentTotals(shipmentId);
    await loadData();
  }

  function csvEscape(val) {
    const str = String(val === undefined || val === null ? '' : val);
    if (/[",\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
    return str;
  }

  function downloadCSV() {
    if (currentFilteredItems.length === 0) {
      showStatus('No items to export.', true);
      return;
    }
    const rows = [['Description', 'Quantity', 'Category', 'Subcategory', 'Material', 'Box Number', 'Room']];
    currentFilteredItems.forEach(item => {
      const boxInfo = boxMap[item.box_id];
      rows.push([
        item.description || '',
        item.quantity || 1,
        item.category || '',
        item.subcategory || '',
        item.material || '',
        boxInfo ? boxInfo.number : '',
        boxInfo ? (boxInfo.room || '') : ''
      ]);
    });
    const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scanifest-items.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function deleteItem(itemId) {
    if (!confirm('Are you sure?')) return;

    const { error } = await supabaseClient.from('items').delete().eq('id', itemId);
    if (error) {
      showStatus('Failed to remove item: ' + error.message, true);
      return;
    }
    await recomputeShipmentTotals(shipmentId);
    await loadData();
  }

  async function addItem() {
    const targetBox = document.getElementById('newItemBox').value;
    if (!targetBox) {
      showStatus('Choose a box for this item first.', true);
      return;
    }
    const description = document.getElementById('itemDescription').value.trim();
    if (!description) {
      showStatus('Give the item a description first.', true);
      return;
    }
    const quantityRaw = document.getElementById('itemQuantity').value;
    const payload = {
      box_id: targetBox,
      description: description,
      quantity: quantityRaw ? parseInt(quantityRaw, 10) : 1,
      category: document.getElementById('itemCategory').value.trim(),
      subcategory: document.getElementById('itemSubcategory').value.trim(),
      material: document.getElementById('itemMaterial').value.trim()
    };

    const { error } = await supabaseClient.from('items').insert(payload);
    if (error) {
      showStatus('Failed to add item: ' + error.message, true);
      return;
    }

    document.getElementById('itemDescription').value = '';
    document.getElementById('itemQuantity').value = '1';
    document.getElementById('itemCategory').value = '';
    document.getElementById('itemSubcategory').value = '';
    document.getElementById('itemMaterial').value = '';
    showStatus('Item added.', false);
    await recomputeShipmentTotals(shipmentId);
    await loadData();
  }

  async function init() {
    if (!shipmentId) {
      showStatus('No shipment specified.', true);
      return;
    }
    const user = await requireAuth('../index.html');
    if (!user) return;

    document.getElementById('backToShipment').href = 'shipment_detail.html?id=' + shipmentId;
    await loadData();
  }

  init();
</script>

</body>
</html>
