<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanifest — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/scanifest-utils.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 400px;
    width: 100%;
    margin: 60px auto;
    padding: 0 20px;
    box-sizing: border-box;
    color: #1a1a1a;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.subtitle { color: #666; margin-top: 0; margin-bottom: 24px; font-size: 14px; }
  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  #status {
    margin-top: 16px;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }
  #status.success { background: #e6f4ea; color: #1e7e34; display: block; }
  #status.error { background: #fdecea; color: #c0392b; display: block; }
</style>
</head>
<body>

<h1>Reset your password</h1>
<p class="subtitle" id="subtitle">Enter a new password below.</p>

<div id="resetForm">
  <input type="password" id="newPassword" placeholder="New password" autocomplete="new-password">
  <button onclick="updatePassword()">Set new password</button>
</div>

<div id="status"></div>

<script>
  const statusEl = document.getElementById('status');

  function showStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = isError ? 'error' : 'success';
  }

  async function updatePassword() {
    const newPassword = document.getElementById('newPassword').value;
    if (!newPassword || newPassword.length < 6) {
      showStatus('Password must be at least 6 characters.', true);
      return;
    }
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
    if (error) {
      showStatus('Failed to update password: ' + error.message, true);
      return;
    }
    showStatus('Password updated. Redirecting...', false);
    document.getElementById('resetForm').style.display = 'none';
    setTimeout(() => { window.location.href = 'shipments.html'; }, 1500);
  }

  // Supabase sends the recovery link with a token that establishes a
  // temporary session automatically when this page loads. If there's
  // no session at all, the link was invalid or expired.
  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      document.getElementById('subtitle').textContent =
        'This reset link is invalid or has expired. Request a new one from the login page.';
      document.getElementById('resetForm').style.display = 'none';
    }
  }

  init();
</script>

</body>
</html>
