<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanifest — Shipments</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  h1 { font-size: 22px; margin: 0; }
  #userEmail { font-size: 13px; color: #666; }
  button.logout {
    background: none;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .shipment-card {
    display: block;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    text-decoration: none;
    color: #1a1a1a;
  }
  .shipment-card-wrap {
    display: flex;
    align-items: stretch;
    gap: 8px;
    margin-bottom: 10px;
  }
  .shipment-card {
    flex: 1;
    display: block;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 14px;
    text-decoration: none;
    color: #1a1a1a;
  }
  .shipment-card:hover { border-color: #999; }
  .shipment-card .name { font-weight: 600; font-size: 16px; }
  .shipment-card .meta { color: #666; font-size: 13px; margin-top: 4px; line-height: 1.5; }
  button.delete-shipment {
    align-self: stretch;
    background: none;
    border: 1px solid #ddd;
    border-radius: 8px;
    color: #c0392b;
    font-size: 12px;
    padding: 8px 10px;
    cursor: pointer;
  }
  button.delete-shipment:hover { border-color: #c0392b; }
  #emptyState { color: #666; font-size: 14px; margin-bottom: 20px; }
  h2 { font-size: 16px; margin-top: 32px; }
  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    box-sizing: border-box;
  }
  button.primary {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  #status {
    margin-top: 12px;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }
  #status.success { background: #e6f4ea; color: #1e7e34; display: block; }
  #status.error { background: #fdecea; color: #c0392b; display: block; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Scanifest</h1>
    <div id="userEmail"></div>
  </div>
  <button class="logout" onclick="logout()">Log out</button>
</header>

<div id="emptyState" style="display:none;">No shipments yet — create your first one below.</div>
<div id="shipmentList"></div>

<h2>New shipment</h2>
<input type="text" id="name" placeholder="Shipment name (e.g. Move to Auckland)">
<button class="primary" onclick="createShipment()">Create shipment</button>
<p style="font-size:13px; color:#666;">You can add the destination and boxes on the next page.</p>

<div id="status"></div>

<script>
  const SUPABASE_URL = 'https://svwhikfrzfnjfysutnze.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_nK1u_alsgjQj85ZvYdzOnQ_bVxWV7Ku';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusEl = document.getElementById('status');
  let currentUser = null;

  function showStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = isError ? 'error' : 'success';
  }

  async function requireAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = '../index.html';
      return null;
    }
    return session.user;
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = '../index.html';
  }

  async function loadShipments() {
    const { data, error } = await supabaseClient
      .from('shipments')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      showStatus('Failed to load shipments: ' + error.message, true);
      return;
    }

    const listEl = document.getElementById('shipmentList');
    const emptyEl = document.getElementById('emptyState');
    listEl.innerHTML = '';

    if (!data || data.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    for (const shipment of data) {
      const { data: boxes, error: boxesError } = await supabaseClient
        .from('boxes')
        .select('id, height, width, length, weight, is_imperial')
        .eq('shipment_id', shipment.id);

      if (boxesError) {
        showStatus('Failed to load shipment totals: ' + boxesError.message, true);
        return;
      }

      const boxIds = (boxes || []).map(box => box.id);
      let items = [];

      if (boxIds.length) {
        const { data: itemData, error: itemsError } = await supabaseClient
          .from('items')
          .select('box_id, quantity')
          .in('box_id', boxIds);

        if (itemsError) {
          showStatus('Failed to load shipment items: ' + itemsError.message, true);
          return;
        }
        items = itemData || [];
      }

      let volumeLitres = 0;
      let totalWeightKg = 0;

      (boxes || []).forEach(box => {
        const h = Number(box.height);
        const w = Number(box.width);
        const l = Number(box.length);

        if (Number.isFinite(h) && Number.isFinite(w) && Number.isFinite(l)) {
          let volumeCm3 = h * w * l;
          if (box.is_imperial) volumeCm3 *= 2.54 ** 3;
          volumeLitres += volumeCm3 / 1000;
        }

        const weight = Number(box.weight);
        if (Number.isFinite(weight)) {
          totalWeightKg += box.is_imperial ? weight * 0.45359237 : weight;
        }
      });

      const totalItems = items.reduce((sum, item) => {
        const quantity = Number(item.quantity);
        return sum + (Number.isFinite(quantity) ? quantity : 1);
      }, 0);

      const { data: destination } = await supabaseClient
        .from('destination')
        .select('suburb, state, country')
        .eq('shipment_id', shipment.id)
        .maybeSingle();

      const destinationText = destination
        ? [destination.suburb, destination.state, destination.country]
            .filter(Boolean)
            .join(', ')
        : 'Destination not set';

      const wrap = document.createElement('div');
      wrap.className = 'shipment-card-wrap';

      const a = document.createElement('a');
      a.className = 'shipment-card';
      a.href = 'shipment_detail.html?id=' + shipment.id;
      a.innerHTML = `
        <div class="name">${escapeHtml(shipment.name || 'Untitled shipment')}</div>
        <div class="meta">
          Total volume: ${volumeLitres.toFixed(1)} L<br>
          Total weight: ${totalWeightKg.toFixed(2)} kg<br>
          Total number of items: ${totalItems}<br>
          Destination: ${escapeHtml(destinationText)}
        </div>
      `;

      const deleteButton = document.createElement('button');
      deleteButton.className = 'delete-shipment';
      deleteButton.textContent = 'Delete';
      deleteButton.onclick = (event) => {
        event.preventDefault();
        event.stopPropagation();
        deleteShipment(shipment.id);
      };

      wrap.appendChild(a);
      wrap.appendChild(deleteButton);
      listEl.appendChild(wrap);
    }
  }

  async function deleteShipment(shipmentIdToDelete) {
    if (!confirm('Are you sure? You will lose all boxes and items.')) return;
    if (!confirm('Are you really, really sure?')) return;

    const { data: boxes, error: boxesError } = await supabaseClient
      .from('boxes')
      .select('id')
      .eq('shipment_id', shipmentIdToDelete);

    if (boxesError) {
      showStatus('Failed to find shipment boxes: ' + boxesError.message, true);
      return;
    }

    const boxIds = (boxes || []).map(box => box.id);

    if (boxIds.length) {
      const { error: itemsError } = await supabaseClient
        .from('items')
        .delete()
        .in('box_id', boxIds);

      if (itemsError) {
        showStatus('Failed to delete shipment items: ' + itemsError.message, true);
        return;
      }

      const { error: boxesDeleteError } = await supabaseClient
        .from('boxes')
        .delete()
        .in('id', boxIds);

      if (boxesDeleteError) {
        showStatus('Failed to delete shipment boxes: ' + boxesDeleteError.message, true);
        return;
      }
    }

    const { error: destinationError } = await supabaseClient
      .from('destination')
      .delete()
      .eq('shipment_id', shipmentIdToDelete);

    if (destinationError) {
      showStatus('Failed to delete shipment destination: ' + destinationError.message, true);
      return;
    }

    const { error: shipmentError } = await supabaseClient
      .from('shipments')
      .delete()
      .eq('id', shipmentIdToDelete);

    if (shipmentError) {
      showStatus('Failed to delete shipment: ' + shipmentError.message, true);
      return;
    }

    showStatus('Shipment deleted.', false);
    loadShipments();
  }

  async function createShipment() {
    const name = document.getElementById('name').value.trim();

    if (!name) {
      showStatus('Give the shipment a name first.', true);
      return;
    }

    const { data, error } = await supabaseClient
      .from('shipments')
      .insert({
        user_id: currentUser.id,
        name: name
      })
      .select();

    if (error) {
      showStatus('Failed to create shipment: ' + error.message, true);
      return;
    }

    showStatus('Shipment created.', false);
    document.getElementById('name').value = '';

    if (data && data[0]) {
      window.location.href = 'shipment_detail.html?id=' + data[0].id;
    } else {
      loadShipments();
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function init() {
    const user = await requireAuth();
    if (!user) return;
    currentUser = user;
    document.getElementById('userEmail').textContent = user.email;
    loadShipments();
  }

  init();
</script>

</body>
</html>
