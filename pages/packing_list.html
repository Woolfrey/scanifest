<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanifest — Packing List</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  a.back {
    font-size: 13px;
    color: #666;
    text-decoration: none;
  }
  button.print-btn {
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
    font-size: 14px;
    padding: 10px 18px;
    cursor: pointer;
  }
  #status {
    margin-bottom: 16px;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }
  #status.error { background: #fdecea; color: #c0392b; display: block; }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    border-bottom: 2px solid #1a1a1a;
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .summary-left { flex: 1; min-width: 0; }
  .summary-right { text-align: right; min-width: 0; }
  .box-number { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .room-tag { font-weight: 400; color: #666; }
  .dims-line { color: #333; font-size: 13px; margin-bottom: 8px; }
  .badges-row { display: flex; gap: 6px; }
  .icon-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid #c0392b;
    color: #c0392b;
    border-radius: 4px;
    padding: 2px 8px;
  }
  .icon-badge svg { width: 12px; height: 12px; }
  .contact-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .address-line { font-size: 13px; color: #333; margin-bottom: 2px; }
  .contact-line { font-size: 13px; color: #333; margin-top: 6px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead { display: table-header-group; }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid #ddd;
  }
  th {
    border-bottom: 2px solid #1a1a1a;
    font-weight: 700;
  }
  td.qty-col, th.qty-col { text-align: right; width: 60px; }
  #emptyItems { color: #666; font-size: 14px; margin-top: 12px; }

  @media print {
    header, #status, .no-print { display: none !important; }
    body { margin: 0; padding: 0; max-width: none; }
  }
  @page {
    size: A4;
    margin: 15mm;
  }
</style>
</head>
<body>

<header class="no-print">
  <a class="back" id="backLink" href="#">← Back to box</a>
  <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
</header>

<div id="status"></div>

<div id="content" style="display:none;">
  <div class="summary-row">
    <div class="summary-left">
      <div class="box-number" id="boxNumberLine"></div>
      <div class="dims-line" id="dimsLine"></div>
      <div class="badges-row" id="badgesRow"></div>
    </div>
    <div class="summary-right" id="destinationBlock"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Description</th>
        <th>Material</th>
        <th class="qty-col">Qty</th>
      </tr>
    </thead>
    <tbody id="itemsTableBody"></tbody>
  </table>
  <div id="emptyItems" style="display:none;">No items recorded in this box.</div>
</div>

<script>
  const SUPABASE_URL = 'https://svwhikfrzfnjfysutnze.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_nK1u_alsgjQj85ZvYdzOnQ_bVxWV7Ku';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusEl = document.getElementById('status');
  const params = new URLSearchParams(window.location.search);
  const boxId = params.get('id');

  function showStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = isError ? 'error' : '';
    statusEl.style.display = message ? 'block' : 'none';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function fragileIcon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2 L22 20 L2 20 Z" stroke-linejoin="round"/>
      <line x1="12" y1="9" x2="12" y2="14"/>
      <circle cx="12" cy="17" r="0.6" fill="currentColor"/>
    </svg>`;
  }
  function heavyIcon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="9" width="4" height="6" rx="1"/>
      <rect x="17" y="9" width="4" height="6" rx="1"/>
      <line x1="7" y1="12" x2="17" y2="12"/>
    </svg>`;
  }

  async function requireAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = '../index.html';
      return null;
    }
    return session.user;
  }

  async function loadAndRender() {
    if (!boxId) {
      showStatus('No box specified.', true);
      return;
    }

    document.getElementById('backLink').href = 'box_detail.html?id=' + boxId;

    const { data: box, error } = await supabaseClient
      .from('boxes')
      .select('*')
      .eq('id', boxId)
      .maybeSingle();

    if (error || !box) {
      showStatus('Could not load this box.', true);
      return;
    }

    const { data: allBoxes } = await supabaseClient
      .from('boxes')
      .select('id')
      .eq('shipment_id', box.shipment_id)
      .order('created_date', { ascending: true });

    const boxList = allBoxes || [];
    const boxNumber = boxList.findIndex(b => b.id === box.id) + 1;
    const totalBoxes = boxList.length;

    const { data: destination } = await supabaseClient
      .from('destination')
      .select('*')
      .eq('shipment_id', box.shipment_id)
      .maybeSingle();

    document.getElementById('content').style.display = 'block';

    document.getElementById('boxNumberLine').innerHTML =
      `Box ${boxNumber} of ${totalBoxes}${box.room ? ' <span class="room-tag">— ' + escapeHtml(box.room) + '</span>' : ''}`;

    const unit = box.is_imperial ? 'in' : 'cm';
    const weightUnit = box.is_imperial ? 'lb' : 'kg';
    const dimsParts = [];
    if (box.height && box.width && box.length) {
      dimsParts.push(`${box.height} × ${box.width} × ${box.length} ${unit}`);
    }
    if (box.weight) dimsParts.push(`${box.weight} ${weightUnit}`);
    document.getElementById('dimsLine').textContent = dimsParts.join(' ⬝ ') || 'Dimensions not set';

    let badgesHtml = '';
    if (box.is_heavy) badgesHtml += `<div class="icon-badge">${heavyIcon()} HEAVY</div>`;
    if (box.is_fragile) badgesHtml += `<div class="icon-badge">${fragileIcon()} FRAGILE</div>`;
    document.getElementById('badgesRow').innerHTML = badgesHtml;

    if (destination) {
      const lines = [];
      if (destination.name) lines.push(`<div class="contact-name">${escapeHtml(destination.name)}</div>`);

      const addressLine = [destination.address_line_1, destination.address_line_2].filter(Boolean).join(', ');
      if (addressLine) lines.push(`<div class="address-line">${escapeHtml(addressLine)}</div>`);

      const regionLine = [destination.suburb, destination.postcode, destination.state, destination.country].filter(Boolean).join(', ');
      if (regionLine) lines.push(`<div class="address-line">${escapeHtml(regionLine)}</div>`);

      if (destination.phone) lines.push(`<div class="contact-line">${escapeHtml(destination.phone)}</div>`);
      if (destination.email) lines.push(`<div class="contact-line">${escapeHtml(destination.email)}</div>`);

      document.getElementById('destinationBlock').innerHTML = lines.join('');
    }

    const { data: items } = await supabaseClient
      .from('items')
      .select('*')
      .eq('box_id', boxId)
      .order('description', { ascending: true });

    const tbody = document.getElementById('itemsTableBody');
    const emptyEl = document.getElementById('emptyItems');
    tbody.innerHTML = '';

    if (!items || items.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    items.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(item.description || 'Untitled item')}</td>
        <td>${escapeHtml(item.material || '')}</td>
        <td class="qty-col">${item.quantity || 1}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function init() {
    const user = await requireAuth();
    if (!user) return;
    await loadAndRender();
  }

  init();
</script>

</body>
</html>
