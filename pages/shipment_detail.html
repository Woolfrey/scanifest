<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanifest — Shipment</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  a.back {
    font-size: 13px;
    color: #666;
    text-decoration: none;
  }
  h1 {
    font-size: 22px;
    margin: 4px 0 0 0;
    border: none;
    padding: 4px 0;
    width: 100%;
  }
  .shipment-summary {
    color: #666;
    font-size: 13px;
    line-height: 1.5;
    margin: 2px 0 8px;
  }
  .box-card-wrap {
    display: flex;
    align-items: stretch;
    gap: 8px;
    margin-bottom: 8px;
  }
  input.name-input {
    font-size: 22px;
    font-weight: 700;
    border: none;
    padding: 4px 0;
    width: 100%;
    font-family: inherit;
    color: #1a1a1a;
  }
  input.name-input:focus {
    outline: none;
    border-bottom: 2px solid #1a1a1a;
  }
  h2 { font-size: 15px; margin-top: 28px; margin-bottom: 10px; color: #444; }
  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .field-grid input { margin-bottom: 0; }
  input {
    width: 100%;
    padding: 9px;
    margin-bottom: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  input:focus { outline: none; border-color: #1a1a1a; }
  .box-card {
    flex: 1;
    display: block;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    text-decoration: none;
    color: #1a1a1a;
  }
  .box-card:hover { border-color: #999; }
  .box-card .box-number { font-weight: 700; font-size: 15px; }
  .box-card .room { font-weight: 600; font-size: 14px; margin-top: 3px; }
  .box-card .meta { color: #666; font-size: 12px; margin-top: 3px; line-height: 1.5; }
  button.delete-box {
    align-self: stretch;
    background: none;
    border: 1px solid #ddd;
    border-radius: 8px;
    color: #c0392b;
    font-size: 12px;
    padding: 8px 10px;
    cursor: pointer;
  }
  button.delete-box:hover { border-color: #c0392b; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    background: #f0f0f0;
    color: #555;
  }
  #emptyBoxes { color: #666; font-size: 14px; margin-bottom: 12px; }
  button.primary {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin-top: 6px;
  }
  #status, #saveIndicator {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  #status.success, #saveIndicator.success { background: #e6f4ea; color: #1e7e34; display: block; }
  #status.error { background: #fdecea; color: #c0392b; display: block; }
</style>
</head>
<body>

<header>
  <a class="back" href="shipments.html">← All shipments</a>
</header>

<input type="text" id="shipmentName" class="name-input" placeholder="Shipment name">
<div id="shipmentSummary" class="shipment-summary"></div>

<h2>Destination</h2>
<input type="text" id="contactName" placeholder="Contact name">
<input type="text" id="contactPhone" placeholder="Contact phone">
<input type="text" id="addressLine1" placeholder="Address line 1">
<input type="text" id="addressLine2" placeholder="Address line 2">
<div class="field-grid">
  <input type="text" id="suburb" placeholder="Suburb">
  <input type="text" id="postcode" placeholder="Postcode">
</div>
<div class="field-grid">
  <input type="text" id="state" placeholder="State">
  <input type="text" id="country" placeholder="Country">
</div>
<button class="primary" onclick="saveAll()">Save</button>
<div id="saveIndicator">Saved</div>

<h2>Boxes</h2>
<div id="emptyBoxes" style="display:none;">No boxes yet — add your first one below.</div>
<div id="boxList"></div>
<button class="primary" onclick="addBox()">+ Add box</button>

<div id="status"></div>

<script>
  const SUPABASE_URL = 'https://svwhikfrzfnjfysutnze.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_nK1u_alsgjQj85ZvYdzOnQ_bVxWV7Ku';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusEl = document.getElementById('status');
  const saveIndicator = document.getElementById('saveIndicator');
  const params = new URLSearchParams(window.location.search);
  const shipmentId = params.get('id');
  let currentUser = null;

  function showStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = isError ? 'error' : 'success';
  }

  function flashSaved() {
    saveIndicator.textContent = 'Saved';
    saveIndicator.className = 'success';
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(() => { saveIndicator.style.display = 'none'; }, 1500);
  }

  async function requireAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = '../index.html';
      return null;
    }
    return session.user;
  }

  async function loadShipment() {
    const { data, error } = await supabaseClient
      .from('shipments')
      .select('*')
      .eq('id', shipmentId)
      .single();

    if (error || !data) {
      showStatus('Could not load this shipment (it may not exist, or you may not have access).', true);
      return;
    }
    document.getElementById('shipmentName').value = data.name || '';
  }

  async function saveAll() {
    const name = document.getElementById('shipmentName').value.trim();
    if (!name) {
      showStatus('Give the shipment a name first.', true);
      return;
    }

    const { error: nameError } = await supabaseClient
      .from('shipments')
      .update({ name })
      .eq('id', shipmentId);

    if (nameError) {
      showStatus('Failed to save shipment name: ' + nameError.message, true);
      return;
    }

    const payload = {
      shipment_id: shipmentId,
      name: document.getElementById('contactName').value.trim(),
      phone: document.getElementById('contactPhone').value.trim(),
      address_line_1: document.getElementById('addressLine1').value.trim(),
      address_line_2: document.getElementById('addressLine2').value.trim(),
      suburb: document.getElementById('suburb').value.trim(),
      postcode: document.getElementById('postcode').value.trim(),
      state: document.getElementById('state').value.trim(),
      country: document.getElementById('country').value.trim()
    };

    const { error: destError } = await supabaseClient
      .from('destination')
      .upsert(payload, { onConflict: 'shipment_id' });

    if (destError) {
      showStatus('Failed to save destination: ' + destError.message, true);
      return;
    }

    flashSaved();
  }

  async function loadDestination() {
    const { data, error } = await supabaseClient
      .from('destination')
      .select('*')
      .eq('shipment_id', shipmentId)
      .maybeSingle();

    if (error) {
      showStatus('Failed to load destination: ' + error.message, true);
      return;
    }
    if (data) {
      document.getElementById('contactName').value = data.name || '';
      document.getElementById('contactPhone').value = data.phone || '';
      document.getElementById('addressLine1').value = data.address_line_1 || '';
      document.getElementById('addressLine2').value = data.address_line_2 || '';
      document.getElementById('suburb').value = data.suburb || '';
      document.getElementById('postcode').value = data.postcode || '';
      document.getElementById('state').value = data.state || '';
      document.getElementById('country').value = data.country || '';
    }
  }

  async function loadBoxes() {
    const { data, error } = await supabaseClient
      .from('boxes')
      .select('*')
      .eq('shipment_id', shipmentId)
      .order('created_at', { ascending: true });

    if (error) {
      // Compatibility with an older schema using created_date.
      const fallback = await supabaseClient
        .from('boxes')
        .select('*')
        .eq('shipment_id', shipmentId)
        .order('created_date', { ascending: true });

      if (fallback.error) {
        showStatus('Failed to load boxes: ' + error.message, true);
        return;
      }
      renderBoxes(fallback.data || []);
      return;
    }

    renderBoxes(data || []);
  }

  async function renderBoxes(data) {
    const listEl = document.getElementById('boxList');
    const emptyEl = document.getElementById('emptyBoxes');
    listEl.innerHTML = '';

    const boxIds = data.map(box => box.id);
    let items = [];

    if (boxIds.length) {
      const { data: itemData, error: itemError } = await supabaseClient
        .from('items')
        .select('box_id, quantity')
        .in('box_id', boxIds);

      if (itemError) {
        showStatus('Failed to load box items: ' + itemError.message, true);
        return;
      }
      items = itemData || [];
    }

    let totalVolumeLitres = 0;
    let totalWeightKg = 0;

    data.forEach(box => {
      const h = Number(box.height);
      const w = Number(box.width);
      const l = Number(box.length);

      if (Number.isFinite(h) && Number.isFinite(w) && Number.isFinite(l)) {
        let volumeCm3 = h * w * l;
        if (box.is_imperial) volumeCm3 *= 2.54 ** 3;
        totalVolumeLitres += volumeCm3 / 1000;
      }

      const weight = Number(box.weight);
      if (Number.isFinite(weight)) {
        totalWeightKg += box.is_imperial ? weight * 0.45359237 : weight;
      }
    });

    const totalItems = items.reduce((sum, item) => {
      const quantity = Number(item.quantity);
      return sum + (Number.isFinite(quantity) ? quantity : 1);
    }, 0);

    document.getElementById('shipmentSummary').innerHTML = `
      Total volume: ${totalVolumeLitres.toFixed(1)} L<br>
      Total weight: ${totalWeightKg.toFixed(2)} kg<br>
      Total number of items: ${totalItems}
    `;

    if (!data.length) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    data.forEach((box, index) => {
      const wrap = document.createElement('div');
      wrap.className = 'box-card-wrap';

      const a = document.createElement('a');
      a.className = 'box-card';
      a.href = 'box_detail.html?id=' + box.id;

      const unit = box.is_imperial ? 'in' : 'cm';
      const dims = (box.height !== null && box.width !== null && box.length !== null)
        ? `${box.height} × ${box.width} × ${box.length} ${unit}`
        : 'Dimensions not set';

      const weightText = box.weight !== null && box.weight !== undefined && box.weight !== ''
        ? `${box.weight} ${box.is_imperial ? 'lb' : 'kg'}`
        : 'Weight not set';

      let badges = '';
      if (box.is_heavy) badges += '<span class="badge">Heavy</span>';
      if (box.is_fragile) badges += '<span class="badge">Fragile</span>';
      if (box.is_private) badges += '<span class="badge">Private</span>';

      const boxItems = items.filter(item => item.box_id === box.id);
      const itemCount = boxItems.reduce((sum, item) => {
        const quantity = Number(item.quantity);
        return sum + (Number.isFinite(quantity) ? quantity : 1);
      }, 0);

      a.innerHTML = `
        <div class="box-number">Box ${index + 1}</div>
        <div class="room">${escapeHtml(box.room || 'Unassigned room')}${badges}</div>
        <div class="meta">
          Dimensions: ${escapeHtml(dims)}<br>
          Weight: ${escapeHtml(weightText)}<br>
          Items: ${itemCount}
        </div>
      `;

      const deleteButton = document.createElement('button');
      deleteButton.className = 'delete-box';
      deleteButton.textContent = 'Delete';
      deleteButton.onclick = (event) => {
        event.preventDefault();
        event.stopPropagation();
        deleteBox(box.id, data);
      };

      wrap.appendChild(a);
      wrap.appendChild(deleteButton);
      listEl.appendChild(wrap);
    });
  }

  async function deleteBox(boxIdToDelete, allBoxes) {
    const alternateBoxes = allBoxes.filter(box => box.id !== boxIdToDelete);
    let transferBoxId = null;

    if (alternateBoxes.length) {
      const choices = alternateBoxes.map((box, index) =>
        `${index + 1}: ${box.room || 'Unassigned room'}`
      ).join('\n');

      const answer = prompt(
        'Enter the number of the box to transfer all items to, or leave blank to delete the items.\n\n' +
        choices
      );

      if (answer === null) return;

      if (answer.trim() !== '') {
        const choice = parseInt(answer.trim(), 10);
        if (!Number.isInteger(choice) || choice < 1 || choice > alternateBoxes.length) {
          showStatus('Invalid destination box.', true);
          return;
        }
        transferBoxId = alternateBoxes[choice - 1].id;
      }
    }

    if (!transferBoxId) {
      if (!confirm('All associated items will be deleted. Are you sure?')) return;

      const { error: itemError } = await supabaseClient
        .from('items')
        .delete()
        .eq('box_id', boxIdToDelete);

      if (itemError) {
        showStatus('Failed to delete box items: ' + itemError.message, true);
        return;
      }
    } else {
      const { error: transferError } = await supabaseClient
        .from('items')
        .update({ box_id: transferBoxId })
        .eq('box_id', boxIdToDelete);

      if (transferError) {
        showStatus('Failed to transfer items: ' + transferError.message, true);
        return;
      }
    }

    const { error: boxError } = await supabaseClient
      .from('boxes')
      .delete()
      .eq('id', boxIdToDelete);

    if (boxError) {
      showStatus('Failed to delete box: ' + boxError.message, true);
      return;
    }

    showStatus(transferBoxId ? 'Box deleted and items transferred.' : 'Box deleted.', false);
    loadBoxes();
  }

  async function addBox() {
    const { data, error } = await supabaseClient
      .from('boxes')
      .insert({
        shipment_id: shipmentId,
        is_private: false,
        is_heavy: false,
        is_fragile: false
      })
      .select();

    if (error) {
      showStatus('Failed to add box: ' + error.message, true);
      return;
    }

    if (data && data[0]) {
      window.location.href = 'box_detail.html?id=' + data[0].id;
    } else {
      loadBoxes();
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function init() {
    if (!shipmentId) {
      showStatus('No shipment specified.', true);
      return;
    }
    const user = await requireAuth();
    if (!user) return;
    currentUser = user;
    await loadShipment();
    await loadDestination();
    await loadBoxes();
  }

  init();
</script>

</body>
</html>
